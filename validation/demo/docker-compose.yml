# OAEF live demo stack: OpenTelemetry Collector + Tempo + Loki + Prometheus + Grafana in one container.
# Image: grafana/otel-lgtm (demo / development use only, not for production).
# Pinned to the image digest of the 2026-11-07 live run (Grafana 13.2.3). Override: LGTM_IMAGE=grafana/otel-lgtm:<tag>
# Start it with validation/demo/start_stack.sh (sets the public URLs used by the Grafana links).
services:
  lgtm:
    image: ${LGTM_IMAGE:-grafana/otel-lgtm@sha256:57b5ab1ca6619beb180174e2fccce04762470750669d043f544b4726d0582d07}
    container_name: oaef-lgtm
    ports:
      - "127.0.0.1:3000:3000"   # Grafana        (bound to localhost; Codespaces forwards it privately)
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP      (used by validation/replay_nin001.py)
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-change-me}
      - OAEF_REPORT_BASE_URL=${OAEF_REPORT_BASE_URL:-http://localhost:8080}
    volumes:
      # OAEF data sources: adds span -> metrics and log -> test report links to the image's defaults
      - ./grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
    restart: unless-stopped
