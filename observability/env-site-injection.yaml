# Generated by env-config-sync from the environment configuration manager (do not hand-edit in GitOps).
# Example for environment "test-int" on site DC1. One rendering per (environment, site, cluster).
# oaef.* = framework attribute namespace (attributes with no semantic convention).

# ---------------------------------------------------------------------------
# 0. Input record as exported from the env configuration manager (COTS API)
# ---------------------------------------------------------------------------
# env_record:
#   env_id: ENV-000123            -> oaef.env.id
#   env_name: test-int            -> deployment.environment.name
#   site: DC1                     -> cloud.region = dc1 (lower-cased)
#   site_role: primary            -> oaef.site.role
#   cluster: dc1-k8s-test         -> k8s.cluster.name
#   snapshot: 2026-10-18T06:00Z#9f3c1a  -> oaef.env.config.version
#   namespaces: [regproc, idrepo, kernel, keymanager, ida, ...]
---
# ---------------------------------------------------------------------------
# 1. Namespace metadata (one per MOSIP namespace). Annotations with prefix
#    resource.opentelemetry.io/ are read as resource attributes by the
#    k8sattributes processor (extract.otel_annotations) and recent OTel Operator versions.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: regproc
  labels:
    oaef.io/env: test-int
    oaef.io/site: dc1
  annotations:
    resource.opentelemetry.io/deployment.environment.name: "test-int"
    resource.opentelemetry.io/cloud.region: "dc1"
    resource.opentelemetry.io/oaef.site.role: "primary"
    resource.opentelemetry.io/oaef.env.id: "ENV-000123"
---
# ---------------------------------------------------------------------------
# 2. OTel Operator auto-instrumentation (Java agent injected into MOSIP pods)
# ---------------------------------------------------------------------------
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: mosip-java
  namespace: regproc
spec:
  exporter:
    endpoint: http://otel-agent.observability:4318
  propagators: [tracecontext, baggage]
  sampler:
    type: parentbased_always_on
  resource:
    addK8sUIDAttributes: true
    resourceAttributes:
      service.namespace: "mosip"
      deployment.environment.name: "test-int"
      k8s.cluster.name: "dc1-k8s-test"
      cloud.region: "dc1"
      oaef.site.role: "primary"
      oaef.env.id: "ENV-000123"
  java:
    env:
      - { name: OTEL_SEMCONV_STABILITY_OPT_IN, value: "database" }
      - { name: OTEL_LOGS_EXPORTER, value: "otlp" }
      - { name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES, value: "*" }
      - { name: OTEL_METRICS_EXEMPLAR_FILTER, value: "trace_based" }
---
# ---------------------------------------------------------------------------
# 3. Collector AGENT (DaemonSet, one config per cluster) = authoritative stamp.
#    Values are upserted: whatever the app sent, the cluster's truth wins.
# ---------------------------------------------------------------------------
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: observability
spec:
  mode: daemonset
  config:
    receivers:
      otlp:
        protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } }
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
      k8sattributes:
        extract:
          otel_annotations: true          # resource.opentelemetry.io/* from pod/namespace annotations
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.deployment.name]
      resource/site-stamp:
        attributes:
          - { key: deployment.environment.name, value: "test-int",          action: upsert }
          - { key: k8s.cluster.name,            value: "dc1-k8s-test",      action: upsert }
          - { key: cloud.region,                value: "dc1",               action: upsert }
          - { key: oaef.site.role,              value: "primary",           action: upsert }
          - { key: oaef.env.id,                 value: "ENV-000123",        action: upsert }
          - { key: oaef.env.config.version,     value: "2026-10-18T06:00Z#9f3c1a", action: upsert }
      batch: {}
    exporters:
      otlp/gateway:
        endpoint: otel-gateway.observability:4317
        tls: { insecure: false }
    service:
      pipelines:
        traces:  { receivers: [otlp], processors: [memory_limiter, k8sattributes, resource/site-stamp, batch], exporters: [otlp/gateway] }
        logs:    { receivers: [otlp], processors: [memory_limiter, k8sattributes, resource/site-stamp, batch], exporters: [otlp/gateway] }
        metrics: { receivers: [otlp], processors: [memory_limiter, k8sattributes, resource/site-stamp, batch], exporters: [otlp/gateway] }
---
# ---------------------------------------------------------------------------
# 4. Collector GATEWAY additions: baggage hygiene + spanmetrics dimensions
# ---------------------------------------------------------------------------
# processors:
#   transform/test-context:            # (alternative to the agent-side BaggageSpanProcessor) nothing to do if extension is used
#   filter/drop-untagged-test: ...     # optional
# connectors:
#   spanmetrics:
#     dimensions:                      # span attributes; resource attributes (env, site) are kept on the generated metrics' resource
#       - name: http.route
#       - name: test.case.name
#     resource_metrics_key_attributes: [service.name, deployment.environment.name, cloud.region]
#
# Egress rule (ingress/egress gateway or API gateway): strip the `baggage` header on calls leaving the
# trust boundary (partners, ABIS vendor, SMS/SMTP providers) and do not accept inbound `baggage` from outside.
